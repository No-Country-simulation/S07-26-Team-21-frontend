<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BENCHMARK.DC - Motor de Benchmark de Madurez de Data Centers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    <!-- TOP NAVIGATION / HEADER -->
    <header class="app-header">
      <div class="logo">BENCHMARK<span>•</span>DC</div>
      <div class="theme-selector">
        <button class="theme-btn" id="themeBtnLight" title="Modo claro">☀️</button>
        <button class="theme-btn" id="themeBtnDark" title="Modo oscuro">🌙</button>
      </div>
      <div class="step-counter" id="stepCounter">PASO 01 / 14</div>
    </header>

    <!-- PROGRESS BAR SEGMENTS -->
    <div class="progress-bar-container" id="progressBarContainer">
      <!-- 14 progress segments generated dynamically -->
    </div>

    <!-- MAIN FORM CARD -->
    <main class="card-container" id="cardContainer">
      <!-- Content populated dynamically by script.js -->
    </main>

    <!-- FOOTER -->
    <footer class="app-footer">
      <span>DIAGNÓSTICO ANÓNIMO</span> • <span>~8 MIN</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
